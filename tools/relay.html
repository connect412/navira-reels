<!doctype html><html><head><meta charset="utf-8"><title>Navira relay</title></head><body>
<p id="s">Ready</p>
<script>
// Hands a week-2 reel from this repo to the Meta Business Suite window that asks for it.
const BASE='https://raw.githubusercontent.com/connect412/navira-reels/claude/project-thread-cxxan2/reels-week2/';
const S=t=>document.getElementById('s').textContent=t;
const cache={};
window.addEventListener('message',async e=>{
  if(e.origin!=='https://business.facebook.com'||!e.data||!e.data.req) return;
  const name=e.data.req;
  try{
    if(!cache[name]){ S('Fetching '+name); cache[name]=fetch(BASE+name).then(r=>r.blob()); }
    const b=await cache[name];
    (e.ports&&e.ports[0]) ? e.ports[0].postMessage({navira:1,name:name,blob:b}) : e.source.postMessage({navira:1,name:name,blob:b},'https://business.facebook.com');
    S('Sent '+name+' '+b.size);
  }catch(err){ S('ERR '+err); }
});
</script></body></html>
